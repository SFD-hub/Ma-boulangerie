[phases.setup]
nixPkgs = [
    "php83",
    "php83Extensions.pdo_sqlite",
    "php83Extensions.pdo_mysql",
    "php83Extensions.mbstring",
    "php83Extensions.tokenizer",
    "php83Extensions.xml",
    "php83Extensions.ctype",
    "php83Extensions.json",
    "php83Extensions.bcmath",
    "php83Extensions.fileinfo",
    "php83Extensions.openssl",
    "php83Extensions.curl",
    "php83Extensions.zip",
    "php83Extensions.intl",
    "composer",
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist",
]

[start]
cmd = "php artisan config:clear && php artisan config:cache && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
