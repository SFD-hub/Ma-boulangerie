; Le conteneur est limité en mémoire (mem_limit, docker-compose.prod.yml) et
; chaque worker PHP peut consommer jusqu'à memory_limit = 256M (php.ini) au
; moment de traiter une photo. Avec le pm.max_children = 5 par défaut de
; l'image php:8.3-fpm, plusieurs requêtes lourdes en même temps peuvent faire
; tourner assez de workers simultanés pour dépasser la limite du conteneur et
; se faire tuer par le noyau (OOM) en plein traitement — la requête meurt sans
; réponse, sans notification d'erreur, sans trace dans les logs applicatifs
; (bug rencontré et corrigé sur ma-quincaillerie, appliqué ici dès le départ).
; On réduit le nombre de workers simultanés pour rester confortablement sous
; la limite du conteneur (3 x 256M = 768M, marge conservée pour
; nginx/supervisor/scheduler).
[www]
pm.max_children = 3
