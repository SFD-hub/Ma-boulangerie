; L'application n'accepte aucun envoi de fichier : limites resserrées (elle refuse déjà plus de 128 Ko
; de saisie par formulaire).
upload_max_filesize = 2M
post_max_size = 2M
file_uploads = Off

; Ne pas annoncer la version de PHP dans les réponses.
expose_php = Off

; Plafond de mémoire par requête. Voir aussi docker/www.conf : le nombre de workers simultanés est
; limité pour que ce plafond ne fasse jamais dépasser la limite mémoire du conteneur
; (mem_limit, docker-compose.prod.yml).
memory_limit = 256M

; Fuseau horaire du serveur (Dakar est à UTC+0 toute l'année, sans heure d'été).
date.timezone = Africa/Dakar
