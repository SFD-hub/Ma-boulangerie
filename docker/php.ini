; Le defaut PHP (2M) rejette silencieusement toute photo (produits, recettes...)
; avant meme qu'elle n'atteigne Laravel -- aligne sur la limite nginx
; (client_max_body_size 20M).
upload_max_filesize = 20M
post_max_size = 25M

; Decoder en memoire une photo haute resolution peut depasser les 128M par
; defaut -- provoque un plantage "memoire epuisee" silencieux (erreur 500 sans
; trace exploitable). Voir aussi docker/www.conf : le nombre de workers
; simultanes est limite pour que ce plafond par requete ne fasse jamais
; depasser la limite memoire du conteneur (mem_limit, docker-compose.prod.yml).
memory_limit = 256M
