<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Send logs to stdout/stderr so Render captures them in its log viewer
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
