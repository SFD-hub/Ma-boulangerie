server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Aucun envoi de fichier dans l'application : les formulaires sont petits (l'application refuse
    # elle-même plus de 128 Ko). Cette limite protège le serveur avant même que PHP ne soit appelé.
    client_max_body_size 1M;

    # Ne pas annoncer la version de nginx.
    server_tokens off;

    # Les en-têtes de sécurité (X-Frame-Options, CSP, etc.) sont envoyés par l'application elle-même :
    # ne pas les répéter ici (un en-tête en double avec une valeur différente est ignoré par les navigateurs).

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
