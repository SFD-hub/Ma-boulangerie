; Fait tourner en continu le scheduler Laravel (php artisan schedule:work)
; à l'intérieur du conteneur applicatif — c'est ce qui déclenche réellement
; Schedule::command('backup:database')->dailyAt('02:00') (routes/console.php).
; Sans ce processus (ou un cron système équivalent), la sauvegarde
; automatique planifiée dans le code ne se lance JAMAIS toute seule.
;
; Installation : copier ce bloc dans la config Supervisor du conteneur
; (ex: /etc/supervisor/conf.d/gestion-boulangerie.conf), ajuster le chemin
; et l'utilisateur, puis : supervisorctl reread && supervisorctl update

[program:gestion-boulangerie-scheduler]
process_name=%(program_name)s
command=php /var/www/app-de-gestion-boulangerie/artisan schedule:work
directory=/var/www/app-de-gestion-boulangerie
autostart=true
autorestart=true
startretries=3
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/gestion-boulangerie-scheduler.log
stdout_logfile_maxbytes=10MB
