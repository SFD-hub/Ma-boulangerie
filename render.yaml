services:
  - type: web
    name: gestion-boulangerie
    env: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: GestionBoulangerie
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"

      # Generate once locally:  php artisan key:generate --show
      # Then paste the result (base64:...) in Render dashboard > Environment
      - key: APP_KEY
        sync: false

      # Set after first deploy: https://gestion-boulangerie.onrender.com
      - key: APP_URL
        sync: false

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      # Database — automatically wired from the PostgreSQL instance below
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DB_HOST
        fromDatabase:
          name: boulangerie-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: boulangerie-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: boulangerie-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: boulangerie-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: boulangerie-db
          property: password

      # Laravel session, cache and queue backed by the database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database

databases:
  - name: boulangerie-db
    plan: free
    databaseName: gestion_boulangerie
    user: boulangerie
